name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # запуск вручную: вкладка Actions → CI → Run workflow

# Новый push в ту же ветку отменяет недоделанный прогон — минуты не тратятся
# на проверку версии, которая уже устарела.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: socialnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg (музыка и видео)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: pg_dump/pg_restore 17 (резервные копии; версия не ниже сервера)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: OpenAPI в актуальном состоянии
        run: python3 api/gen_openapi.py && git diff --exit-code api/openapi.json
      - run: go vet ./...
      - name: Тесты с детектором гонок
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/socialnet_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: socialnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install -g typescript@6.0.3 playwright@1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Собранный фронтенд соответствует исходникам
        run: cd web && tsc -p . && git diff --exit-code static/app
      - run: npx playwright install --with-deps chromium
      - name: Сквозной тест в браузере
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/socialnet_test?sslmode=disable
          E2E_SCREENSHOTS: ${{ runner.temp }}/shots
        run: mkdir -p "$E2E_SCREENSHOTS" && go test -count=1 -run 'TestFrontend' ./internal/httpapi/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots

  # Настоящие образы: сборка Dockerfile, весь стек в compose и сквозная проверка.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env для проверки
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          TOTP_ENC_KEY=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          BACKUP_ENC_KEY=$(openssl rand -hex 32)
          COOKIE_SECURE=false
          EOF
      - run: docker compose up -d --build --wait
      - run: python3 deploy/smoke.py
      - if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck — известные уязвимости в зависимостях
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec — статический анализ безопасности
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude-dir=api -exclude=G115 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/textparse, fn: FuzzExtract }
          - { pkg: ./internal/media, fn: FuzzExif }
          - { pkg: ./internal/media, fn: FuzzProcess }
          - { pkg: ./internal/av, fn: FuzzSniff }
          - { pkg: ./internal/webpush, fn: FuzzDecrypt }
          - { pkg: ./internal/webpush, fn: FuzzValidateEndpoint }
          - { pkg: ./internal/auth, fn: FuzzVerifyPassword }
          - { pkg: ./internal/auth, fn: FuzzParseAccess }
          - { pkg: ./internal/httpapi, fn: FuzzCleanText }
          - { pkg: ./internal/redisx, fn: FuzzReadReply }
          - { pkg: ./internal/backup, fn: FuzzDecrypt }
          - { pkg: ./internal/yookassa, fn: FuzzParseKopecks }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ${{ matrix.target.fn }}
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 60s

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t socialnet:ci .
      - name: Trivy — уязвимости в образе
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: socialnet:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
