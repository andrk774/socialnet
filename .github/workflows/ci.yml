name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # запуск вручную: вкладка Actions → CI → Run workflow

# Новый push в ту же ветку отменяет недоделанный прогон — минуты не тратятся
# на проверку версии, которая уже устарела.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: socialnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: ffmpeg (музыка и видео)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: pg_dump/pg_restore 17 (резервные копии; версия не ниже сервера)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: OpenAPI в актуальном состоянии
        run: python3 api/gen_openapi.py && git diff --exit-code api/openapi.json
      - run: go vet ./...
      - name: Тесты с детектором гонок
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/socialnet_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: socialnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm install -g typescript@6.0.3 playwright@1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Собранный фронтенд соответствует исходникам
        run: cd web && tsc -p . && git diff --exit-code static/app
      - run: npx playwright install --with-deps chromium
      - name: Сквозной тест в браузере
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/socialnet_test?sslmode=disable
          E2E_SCREENSHOTS: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$E2E_SCREENSHOTS"
          set -o pipefail
          go test -count=1 -timeout 8m -run 'TestFrontend' ./internal/httpapi/ 2>&1 | tee e2e.log
      - if: failure()
        name: Причина сбоя e2e — в аннотации
        run: |
          grep -v '^\s*at ' e2e.log | grep -iE 'error|fail|assert|expected|actual|timeout|waiting for|e2e:' | head -30 |
            while IFS= read -r line; do echo "::error title=e2e::$line"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots

  # Настоящие образы: сборка Dockerfile, весь стек в compose и сквозная проверка.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: .env для проверки
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          TOTP_ENC_KEY=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          BACKUP_ENC_KEY=$(openssl rand -hex 32)
          COOKIE_SECURE=false
          EOF
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: python3 deploy/smoke.py
      - if: failure()
        name: Причина сбоя — в аннотации (видны в сводке прогона без открытия логов)
        run: |
          docker compose ps -a
          docker compose logs --tail 200
          note() { printf '::error title=%s::%s\n' "$1" "$(printf '%s' "$2" | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          note "compose ps" "$(docker compose ps -a 2>&1)"
          for svc in $(docker compose config --services); do
            st=$(docker compose ps -a --format '{{.State}} {{.Health}}' "$svc" 2>/dev/null | head -1)
            case "$st" in "running healthy"|"running ") ;; *) note "$svc: $st" "$(docker compose logs --no-color --tail 40 "$svc" 2>&1)";; esac
          done
      - if: always()
        run: docker compose down -v

  # Боевая конфигурация: Caddy с HTTPS (для localhost — свой центр
  # сертификации), закрытые порты, Secure-cookie, реальный IP клиента.
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: .env для проверки
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          TOTP_ENC_KEY=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          BACKUP_ENC_KEY=$(openssl rand -hex 32)
          DOMAIN=localhost
          ACME_EMAIL=admin@example.com
          SMTP_HOST=smtp.invalid
          EOF
      - name: Caddyfile корректен
        run: docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=a@example.com -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - run: python3 deploy/prod_check.py
      - name: Скрипты деплоя
        run: bash -n deploy/setup-server.sh deploy/update.sh && shellcheck deploy/setup-server.sh deploy/update.sh
      - if: failure()
        name: Причина сбоя — в аннотации
        run: |
          note() { printf '::error title=%s::%s\n' "$1" "$(printf '%s' "$2" | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          note "compose ps" "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -a 2>&1)"
          note "caddy" "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail 40 caddy 2>&1)"
          note "api" "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail 40 api 2>&1)"
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Версия закреплена: @latest означал бы, что проверка меняется сама по себе
      # и может упасть или пропустить проблему без изменений в коде.
      # gosec отдельно не запускается: он уже входит в golangci-lint (задание lint)
      # с закреплённой версией и теми же исключениями, что и локальный `make lint`.
      - name: govulncheck — известные уязвимости в зависимостях
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/textparse, fn: FuzzExtract }
          - { pkg: ./internal/media, fn: FuzzExif }
          - { pkg: ./internal/media, fn: FuzzProcess }
          - { pkg: ./internal/av, fn: FuzzSniff }
          - { pkg: ./internal/webpush, fn: FuzzDecrypt }
          - { pkg: ./internal/webpush, fn: FuzzValidateEndpoint }
          - { pkg: ./internal/auth, fn: FuzzVerifyPassword }
          - { pkg: ./internal/auth, fn: FuzzParseAccess }
          - { pkg: ./internal/httpapi, fn: FuzzCleanText }
          - { pkg: ./internal/redisx, fn: FuzzReadReply }
          - { pkg: ./internal/backup, fn: FuzzDecrypt }
          - { pkg: ./internal/yookassa, fn: FuzzParseKopecks }
          - { pkg: ./internal/gpx, fn: FuzzParse }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: ${{ matrix.target.fn }}
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 60s

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v5
      - name: Сборка образа
        run: docker build -t socialnet:ci .
      - name: Trivy — уязвимости в образе
        # Сторонние действия — только по полному хэшу коммита: в марте 2026
        # теги trivy-action перезаписали на код, кравший секреты CI
        # (GHSA-69fq-xp46-6x23). Хэш ниже — v0.35.0, единственная непострадавшая
        # версия; Trivy — из проверенного диапазона 0.69.2–0.69.3.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          image-ref: socialnet:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # находки — ещё и в файл, чтобы показать их в аннотациях прогона
          format: template
          template: '{{- range . }}{{- $t := .Target }}{{- range .Vulnerabilities }}{{ .Severity }} {{ .VulnerabilityID }} {{ .PkgName }} {{ .InstalledVersion }} → {{ .FixedVersion }} ({{ $t }}){{ "\n" }}{{- end }}{{- end }}'
          output: trivy.txt
      - if: failure()
        name: Находки Trivy — в аннотации
        run: |
          test -s trivy.txt || exit 0
          cat trivy.txt
          sort -u trivy.txt | head -40 | while IFS= read -r line; do echo "::error title=Trivy::$line"; done
