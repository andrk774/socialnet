services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialnet
      POSTGRES_USER: socialnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт открыт только на localhost: подключаться из psql/DBeaver на своей машине.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [default, backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialnet -d socialnet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      DATABASE_URL: postgres://socialnet:${POSTGRES_PASSWORD}@db:5432/socialnet?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      HTTP_ADDR: ":8080"
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_RATE_PER_MIN: ${AUTH_RATE_PER_MIN:-10}
      AUTH_RATE_BURST: ${AUTH_RATE_BURST:-20}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MEDIA_DIR: /data/media
      APP_URL: ${APP_URL:-http://localhost:3000}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-security@localhost}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      YOOKASSA_CHECK_IP: ${YOOKASSA_CHECK_IP:-true}
      # По умолчанию письма уходят в Mailpit (http://127.0.0.1:8025).
      # Для настоящей почты укажите в .env свой SMTP.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Socialnet <no-reply@localhost>}
    volumes:
      - media:/data/media
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  # Фоновая обработка видео (ffmpeg). Изолирован сильнее всего:
  # только внутренняя сеть (нет интернета), файловая система только для
  # чтения, никаких привилегий, лимиты CPU и памяти.
  worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *env
    volumes:
      - media:/data/media
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2

  # Тестовый почтовый сервер для разработки: все письма видны в браузере
  # на http://127.0.0.1:8025. На боевом сервере этот сервис можно удалить.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

networks:
  default:
  backend:
    internal: true   # без выхода в интернет

volumes:
  pgdata:
  media:
