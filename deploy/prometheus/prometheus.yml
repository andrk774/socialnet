global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: socialnet-api
    metrics_path: /metrics
    # если задан METRICS_TOKEN, раскомментируйте:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:9090"]
